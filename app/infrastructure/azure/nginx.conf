# Azure terminates TLS and appends the verified client IP at the RIGHT end.
# Discard all earlier entries supplied by the caller; never trust the leftmost IP.
# Only expose this port through ACA ingress, with allowInsecure=false.
map $http_x_forwarded_for $aca_client_ip {
    default $remote_addr;
    ~(?<last_forwarded_ip>[^,\s]+)\s*$ $last_forwarded_ip;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 9m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $aca_client_ip;
        proxy_set_header X-Real-IP $aca_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
